---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: hpa-shard-a
  namespace: assignment3
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: StatefulSet
    name: shard-a
  minReplicas: 2
  maxReplicas: 5
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 50
