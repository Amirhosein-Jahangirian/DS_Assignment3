---
apiVersion: v1
kind: Service
metadata:
  name: shard-a
  namespace: assignment3
spec:
  clusterIP: None
  publishNotReadyAddresses: false
  selector:
    app: shard-a
  ports:
    - name: http
      port: 8000
      targetPort: 8000
---
apiVersion: v1
kind: Service
metadata:
  name: shard-b
  namespace: assignment3
spec:
  clusterIP: None
  selector:
    app: shard-b
  ports:
    - name: http
      port: 8000
      targetPort: 8000
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: shard-a
  namespace: assignment3
spec:
  serviceName: shard-a
  replicas: 2
  ordinals:
    start: 1
  podManagementPolicy: Parallel
  selector:
    matchLabels:
      app: shard-a
  updateStrategy:
    type: RollingUpdate
  template:
    metadata:
      labels:
        app: shard-a
        tier: shard-api
    spec:
      terminationGracePeriodSeconds: 45
      containers:
        - name: api
          image: amirhossein002/banking_with_sharding:replica_api
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8000
          env:
            - name: SHARD_ID
              value: "shard-a"
            - name: REPLICA_ID
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: DB_HOST
              value: "db-a-rw"
            - name: DB_NAME
              value: "banking_a"
            - name: DB_PORT
              value: "5432"
            - name: DB_USER
              valueFrom:
                secretKeyRef:
                  name: banking-db-credentials
                  key: username
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: banking-db-credentials
                  key: password
            - name: SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: banking-app-secret
                  key: SECRET_KEY
            - name: DEBUG
              value: "False"
            - name: ALLOWED_HOSTS
              value: "*"
            - name: CONFIG_DIR
              value: "/app/config"
            - name: SHARD_MAP_PATH
              value: "/app/config/shard_map.yaml"
            - name: MAX_CONCURRENT_CLIENTS
              value: "20"
            - name: PREPARE_LOCK_TIMEOUT_MS
              value: "4000"
            - name: PREPARE_STATEMENT_TIMEOUT_MS
              value: "5000"
          lifecycle:
            preStop:
              exec:
                command: ["sleep", "5"]
          startupProbe:
            httpGet: { path: /health, port: 8000 }
            periodSeconds: 3
            failureThreshold: 30
          readinessProbe:
            httpGet: { path: /health, port: 8000 }
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 2
          livenessProbe:
            httpGet: { path: /health, port: 8000 }
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          resources:
            requests: { cpu: "200m", memory: "256Mi" }
            limits:   { cpu: "1500m", memory: "512Mi" }  
          volumeMounts:
            - name: config
              mountPath: /app/config
              readOnly: true
      volumes:
        - name: config
          configMap:
            name: banking-config
