---
apiVersion: v1
kind: Service
metadata:
  name: gateway
  namespace: assignment3
spec:
  type: NodePort
  selector:
    app: gateway
  ports:
    - name: http
      port: 8000
      targetPort: 8000
      nodePort: 30080
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: gateway
  namespace: assignment3
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: gateway
  template:
    metadata:
      labels:
        app: gateway
        tier: gateway
    spec:
      terminationGracePeriodSeconds: 40
      containers:
        - name: gateway
          image: amirhossein002/banking_with_sharding:gateway
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8000
          env:
            - name: CONFIG_DIR
              value: "/app/config"
            - name: COORD_DB_HOST
              value: "coord-db-rw"
            - name: COORD_DB_PORT
              value: "5432"
            - name: COORD_DB_NAME
              value: "banking_coord"
            - name: COORD_DB_USER
              valueFrom:
                secretKeyRef:
                  name: banking-db-credentials
                  key: username
            - name: COORD_DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: banking-db-credentials
                  key: password
            - name: COORD_RPC_TIMEOUT_SECONDS
              value: "6"
            - name: COORD_RPC_ATTEMPTS
              value: "2"
            - name: COORD_RECOVERY_INTERVAL_SECONDS
              value: "5"
            - name: COORD_PREPARING_GRACE_SECONDS
              value: "12"
            - name: COORD_TEST_PAUSE_AFTER_PREPARE_SECONDS
              value: "0"
            - name: COORD_TEST_PAUSE_AFTER_DECISION_SECONDS
              value: "0"
          startupProbe:
            httpGet: { path: /health, port: 8000 }
            periodSeconds: 3
            failureThreshold: 30
          readinessProbe:
            httpGet: { path: /health, port: 8000 }
            periodSeconds: 5
            timeoutSeconds: 3
          livenessProbe:
            httpGet: { path: /health, port: 8000 }
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          resources:
            requests: { cpu: "100m", memory: "192Mi" }
            limits:   { cpu: "500m", memory: "384Mi" }
          volumeMounts:
            - name: config
              mountPath: /app/config
              readOnly: true
      volumes:
        - name: config
          configMap:
            name: banking-config